<!-- Contador con Botones
Crear un botón para incrementar y otro para decrementar un contador mostrado en
un elemento div. Actualizar el texto del div al hacer clic. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="contador">0</div>
    <button id="incrementar">Incrementar contador</button>
    <button id="decrementar">Decrementar contador</button>
    <script src="contador.js"></script>
</body>
</html>
